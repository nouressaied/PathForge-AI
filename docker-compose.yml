
services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: pathforge-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pathforge-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: pathforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathforge
      POSTGRES_USER: pathforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pathforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathforge -d pathforge"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:

networks:
  pathforge-network:
    driver: bridge
